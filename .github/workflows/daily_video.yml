name: Daily YouTube Video

on:
  schedule:
    - cron: '0 16 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          # ffmpeg + fonts are required (Python tts/concat + render text).
          sudo apt-get install -y ffmpeg fonts-liberation
          # Chrome headless shell libs for Remotion (best-effort: package names differ across
          # Ubuntu versions, e.g. libasound2 -> libasound2t64 on 24.04, and the runner already
          # ships most of these, so a missing one must not fail the build).
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install dependencies
        run: |
          pip uninstall google-generativeai -y || true
          pip install --no-cache-dir -r requirements.txt

      - name: Install Remotion deps
        working-directory: remotion
        run: npm install

      - name: Run video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python src/main.py

      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json 2>/dev/null || true
          if [ -d production_logs ]; then git add production_logs; fi
          git diff --cached --quiet || git commit -m "chore: episode $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failed: ${context.runId}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
