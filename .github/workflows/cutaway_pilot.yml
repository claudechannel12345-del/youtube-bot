name: Cutaway Pilot

on:
  workflow_dispatch:
    inputs:
      do_upload:
        description: Upload the rendered video to YouTube
        required: true
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render voiced cutaway
        env:
          TTS_PROVIDER: elevenlabs
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DO_UPLOAD: ${{ inputs.do_upload && '1' || '0' }}
          UPLOAD_PRIVACY: unlisted
        run: python scripts/render_voiced.py

      - name: Upload render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps_voiced
          path: remotion/slice_stills/gps_voiced.mp4
